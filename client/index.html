<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F7F5F1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Fraunces carries the voice: a soft, slightly irregular serif that reads as
      warmth rather than clinical authority. SOFT=40 rounds the terminals and
      WONK=1 keeps the eccentric forms, which is what stops it reading as a
      corporate serif. Karla does the work at small sizes. JetBrains Mono is
      reserved for figures that must not shift width as they change.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,40,1&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>VitalAI — know what's in your food</title>
    <meta name="description" content="Scan a food label and find out what it means for you specifically — your allergies, your conditions, your medicines. Grounded in cited nutrition sources, not guesswork." />

    <!-- Open Graph / Twitter. Absolute URLs are required: a relative og:image is
         ignored by every scraper. Replace the domain at deploy time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VitalAI" />
    <meta property="og:title" content="VitalAI — know what's in your food" />
    <meta property="og:description" content="Scan a food label and find out what it means for you specifically — your allergies, your conditions, your medicines." />
    <meta property="og:url" content="https://REPLACE_WITH_YOUR_DOMAIN/" />
    <meta property="og:image" content="https://REPLACE_WITH_YOUR_DOMAIN/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VitalAI — know what's in your food" />
    <meta name="twitter:description" content="Scan a food label and find out what it means for you specifically." />
    <meta name="twitter:image" content="https://REPLACE_WITH_YOUR_DOMAIN/og.png" />
    <link rel="canonical" href="https://REPLACE_WITH_YOUR_DOMAIN/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
